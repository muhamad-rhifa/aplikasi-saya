<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Telegram AI Bot</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head><body><div class="app-container"><header class="chat-header"><div class="bot-info"><div class="avatar"><i class="fa-solid fa-robot"></i></div><div><h1>Telegram AI Assistant</h1><p class="status">Online • Siap mengobrol & coding</p></div></div><button id="clear-btn" title="Hapus Riwayat"><i class="fa-solid fa-trash-can"></i></button></header><div id="chat-messages" class="chat-messages"></div><div class="chat-input-area"><div class="input-wrapper"><textarea id="user-input" placeholder="Ketik pesan atau minta buat aplikasi..." rows="1"></textarea><button id="send-btn"><i class="fa-solid fa-paper-plane"></i></button></div><div class="hint">Ketik "buat aplikasi [nama]" untuk men-generate kode, atau ajak ngobrol biasa.</div></div></div><script src="app.js"></script></body></html>

<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Kamus Istilah Pribadi</title><link rel="stylesheet" href="style.css"></head><body><div class="app-container"><header><h1>Kamus Saya</h1><p>Simpan definisi dan istilah penting di sini.</p></header><div class="search-box"><input type="text" id="searchInput" placeholder="Cari istilah..." onkeyup="filterTerms()"></div><div class="add-section"><button id="openModalBtn" class="btn-primary">+ Tambah Istilah</button></div><div id="termList" class="term-list"></div></div><div id="modal" class="modal"><div class="modal-content"><h3>Tambah Istilah Baru</h3><input type="text" id="termInput" placeholder="Istilah (Contoh: Kucing)"><textarea id="definitionInput" placeholder="Definisi (Contoh: Hewan mamalia karnivora kecil)"></textarea><div class="modal-actions"><button onclick="closeModal()" class="btn-secondary">Batal</button><button onclick="saveTerm()" class="btn-primary">Simpan</button></div></div></div><script src="app.js"></script></body></html>
